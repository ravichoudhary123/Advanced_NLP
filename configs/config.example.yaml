account_starting_cash: 100000
leaders_watchlist_file: configs/watchlist.example.yaml

execution:
  mode: paper
  allow_live: false
  market_hours_only: true
  orchestration_engine: native

data:
  benchmark_symbols: ["SPY", "QQQ", "SOXX"]
  timeframes: ["1m", "5m", "15m", "1h", "1d"]
  lookback_days: 180

risk:
  max_trade_pct: 0.05
  max_symbol_pct: 0.15
  daily_loss_stop_pct: 0.03
  max_drawdown_pct: 0.15
  max_open_positions: 8
  min_dollar_volume: 2000000
  stop_loss_pct: 0.06
  take_profit_pct: 0.15
  trailing_stop_pct: 0.05
